# Nightly lane (production only). Policy: docs/ci-test-policy.md
# PR lane (integration + full suite): .github/workflows/pr-integration.yml
#
# Dual @nightly-prod: Cloudflare edge (PLAYWRIGHT_BASE_URL_PROD / mydoccy.com) then
# Vercel origin (PLAYWRIGHT_BASE_URL_VERCEL_PROD / *.vercel.app), sequential to avoid
# booking the same prod doctor slot. Email guards stay a single job (@pr-email).
# Optional: VERCEL_AUTOMATION_BYPASS_SECRET for Deployment Protection on origin.
#
# Blocking: prod Supabase + public shell, guest booking, live registration, email guards.
# Doctor login form UI: PR non-blocking (`doctor_password_login_form.spec.ts` @pr-login-monitor).
# Integration E2E (finder, navigation, etc.) runs only on PR — not duplicated here.

name: Production Monitoring

on:
  workflow_dispatch:
    inputs:
      notify_only:
        description: "Send only WhatsApp notification (skip smoke tests)"
        required: false
        default: false
        type: boolean
      notification_message:
        description: "Optional extra text appended to WhatsApp message"
        required: false
        default: ""
        type: string
  schedule:
    # GitHub Actions cron is UTC. Scheduled runs are often delayed by hours (see schedule-gate).
    - cron: "30 3 * * *" # ~06:30 Nicosia (EEST/EET); gate allows 05:00–13:59 local if delayed

permissions:
  contents: read
  issues: write

# Avoid overlapping nightly runs when GitHub queues multiple schedule triggers.
concurrency:
  group: production-monitoring-nightly
  cancel-in-progress: false

jobs:
  schedule-gate:
    runs-on: ubuntu-latest
    outputs:
      should_run: ${{ steps.gate.outputs.should_run }}
      nicosia_time: ${{ steps.gate.outputs.nicosia_time }}
    steps:
      - name: Decide run window (always 06:00 Cyprus)
        id: gate
        shell: bash
        run: |
          set -euo pipefail
          if [ "${GITHUB_EVENT_NAME}" = "workflow_dispatch" ]; then
            echo "Manual dispatch: bypassing time gate."
            echo "should_run=true" >> "$GITHUB_OUTPUT"
            echo "nicosia_time=manual" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          stamp="$(TZ=Europe/Nicosia date '+%Y-%m-%d %H:%M:%S %Z')"
          nico_h="$(TZ=Europe/Nicosia date +%H)"
          nico_m="$(TZ=Europe/Nicosia date +%M)"
          utc_h="$(date -u +%H)"
          echo "Nicosia local time: ${stamp} (local H=${nico_h} M=${nico_m}, UTC hour=${utc_h})"

          # Scheduled workflows are often delayed (e.g. 03:30 UTC cron starting at 07:37 UTC).
          # A narrow 06:00–07:45 window caused weeks of skipped smoke + WhatsApp (should_run=false).
          # Allow morning local hours 05–13 so delayed runs still execute once per day.
          nico_h_num=$((10#${nico_h}))
          should_run="false"
          if [ "${nico_h_num}" -ge 5 ] && [ "${nico_h_num}" -le 13 ]; then
            should_run="true"
          fi

          if [ "${should_run}" = "true" ]; then
            echo "should_run=true" >> "$GITHUB_OUTPUT"
          else
            echo "should_run=false" >> "$GITHUB_OUTPUT"
          fi
          echo "nicosia_time=${stamp}" >> "$GITHUB_OUTPUT"

          {
            echo "## Schedule gate (Production Monitoring)"
            echo "- **should_run:** ${should_run}"
            echo "- **Nicosia:** ${stamp}"
            echo "- **Local H:M** ${nico_h}:${nico_m} **UTC hour** ${utc_h}"
          } >> "${GITHUB_STEP_SUMMARY}"

  # Dual smoke: Cloudflare edge (mydoccy.com) vs Vercel origin (*.vercel.app).
  # Sequential origin-after-edge so both do not book the same prod doctor slot.
  # If PLAYWRIGHT_BASE_URL_VERCEL_PROD is set, edge is diagnostic (continue-on-error)
  # and origin is blocking. If unset, edge stays blocking (legacy).
  smoke-targets:
    needs: [schedule-gate]
    if: needs.schedule-gate.outputs.should_run == 'true'
    runs-on: ubuntu-latest
    outputs:
      origin_enabled: ${{ steps.check.outputs.origin_enabled }}
    steps:
      - id: check
        env:
          ORIGIN_URL: ${{ secrets.PLAYWRIGHT_BASE_URL_VERCEL_PROD }}
        run: |
          set -euo pipefail
          if [ -n "${ORIGIN_URL}" ]; then
            echo "origin_enabled=true" >> "$GITHUB_OUTPUT"
            echo "Origin Vercel smoke enabled (edge will be diagnostic)."
          else
            echo "origin_enabled=false" >> "$GITHUB_OUTPUT"
            echo "Origin Vercel smoke skipped. Set PLAYWRIGHT_BASE_URL_VERCEL_PROD to compare Cloudflare vs origin."
          fi

  prod-email-guards:
    needs: [schedule-gate]
    if: needs.schedule-gate.outputs.should_run == 'true' && (github.event_name != 'workflow_dispatch' || github.event.inputs.notify_only != 'true')
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Cache Playwright browsers
        id: playwright-cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-${{ hashFiles('**/package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-playwright-

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: Run critical reschedule email guards
        env:
          CI: "true"
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.PROD_NEXT_PUBLIC_SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.PROD_NEXT_PUBLIC_SUPABASE_ANON_KEY }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.PROD_SUPABASE_SERVICE_ROLE_KEY }}
          DOC_CY_SUPPRESS_TRAFFIC_LOG_SECRET: ${{ secrets.DOC_CY_SUPPRESS_TRAFFIC_LOG_SECRET }}
        run: |
          npx playwright test --grep @pr-email \
            --project="Desktop Large (Chromium)" \
            --workers=1 \
            --reporter=line

  prod-smoke-edge:
    needs: [schedule-gate, smoke-targets]
    if: needs.schedule-gate.outputs.should_run == 'true' && (github.event_name != 'workflow_dispatch' || github.event.inputs.notify_only != 'true')
    runs-on: ubuntu-latest
    timeout-minutes: 45
    continue-on-error: ${{ needs.smoke-targets.outputs.origin_enabled == 'true' }}
    env:
      PLAYWRIGHT_BASE_URL: ${{ secrets.PLAYWRIGHT_BASE_URL_PROD }}
      PROD_SITE_URL: ${{ secrets.PROD_SITE_URL || secrets.NEXT_PUBLIC_SITE_URL }}
      NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.PROD_NEXT_PUBLIC_SUPABASE_URL }}
      NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.PROD_NEXT_PUBLIC_SUPABASE_ANON_KEY }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.PROD_SUPABASE_SERVICE_ROLE_KEY }}
      PROD_NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.PROD_NEXT_PUBLIC_SUPABASE_URL }}
      INTEGRATION_SUPABASE_URL: ${{ secrets.INTEGRATION_SUPABASE_URL }}
      DOC_CY_SUPPRESS_TRAFFIC_LOG_SECRET: ${{ secrets.DOC_CY_SUPPRESS_TRAFFIC_LOG_SECRET }}
      TEST_DOCTOR_EMAIL: ${{ secrets.TEST_DOCTOR_EMAIL }}
      TEST_DOCTOR_PASSWORD: ${{ secrets.TEST_DOCTOR_PASSWORD }}
      TEST_USER_EMAIL: ${{ secrets.TEST_USER_EMAIL || secrets.TEST_DOCTOR_EMAIL }}
      TEST_USER_PASSWORD: ${{ secrets.TEST_USER_PASSWORD || secrets.TEST_DOCTOR_PASSWORD }}
      TEST_BOOKING_DOCTOR_SLUG: ${{ secrets.TEST_BOOKING_DOCTOR_SLUG }}
      INTERNAL_DIRECTORY_SECRET: ${{ secrets.INTERNAL_DIRECTORY_SECRET }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Prod nightly smoke (Cloudflare edge)
        uses: ./.github/actions/prod-nightly-smoke
        with:
          target: edge
          artifact_name: playwright-prod-monitoring-report-edge

  prod-smoke-origin:
    needs: [schedule-gate, smoke-targets, prod-smoke-edge]
    if: needs.schedule-gate.outputs.should_run == 'true' && needs.smoke-targets.outputs.origin_enabled == 'true' && (github.event_name != 'workflow_dispatch' || github.event.inputs.notify_only != 'true')
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      PLAYWRIGHT_BASE_URL: ${{ secrets.PLAYWRIGHT_BASE_URL_VERCEL_PROD }}
      PROD_SITE_URL: ${{ secrets.PROD_SITE_URL || secrets.NEXT_PUBLIC_SITE_URL }}
      NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.PROD_NEXT_PUBLIC_SUPABASE_URL }}
      NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.PROD_NEXT_PUBLIC_SUPABASE_ANON_KEY }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.PROD_SUPABASE_SERVICE_ROLE_KEY }}
      PROD_NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.PROD_NEXT_PUBLIC_SUPABASE_URL }}
      INTEGRATION_SUPABASE_URL: ${{ secrets.INTEGRATION_SUPABASE_URL }}
      DOC_CY_SUPPRESS_TRAFFIC_LOG_SECRET: ${{ secrets.DOC_CY_SUPPRESS_TRAFFIC_LOG_SECRET }}
      VERCEL_AUTOMATION_BYPASS_SECRET: ${{ secrets.VERCEL_AUTOMATION_BYPASS_SECRET }}
      TEST_DOCTOR_EMAIL: ${{ secrets.TEST_DOCTOR_EMAIL }}
      TEST_DOCTOR_PASSWORD: ${{ secrets.TEST_DOCTOR_PASSWORD }}
      TEST_USER_EMAIL: ${{ secrets.TEST_USER_EMAIL || secrets.TEST_DOCTOR_EMAIL }}
      TEST_USER_PASSWORD: ${{ secrets.TEST_USER_PASSWORD || secrets.TEST_DOCTOR_PASSWORD }}
      TEST_BOOKING_DOCTOR_SLUG: ${{ secrets.TEST_BOOKING_DOCTOR_SLUG }}
      INTERNAL_DIRECTORY_SECRET: ${{ secrets.INTERNAL_DIRECTORY_SECRET }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Prod nightly smoke (Vercel origin)
        uses: ./.github/actions/prod-nightly-smoke
        with:
          target: origin
          artifact_name: playwright-prod-monitoring-report-origin

  prod-nightly-gate:
    needs: [schedule-gate, prod-email-guards, prod-smoke-edge, prod-smoke-origin]
    if: always() && needs.schedule-gate.outputs.should_run == 'true' && (github.event_name != 'workflow_dispatch' || github.event.inputs.notify_only != 'true')
    runs-on: ubuntu-latest
    steps:
      - name: Interpret dual smoke
        env:
          EMAIL_RESULT: ${{ needs.prod-email-guards.result }}
          EDGE_RESULT: ${{ needs.prod-smoke-edge.result }}
          ORIGIN_RESULT: ${{ needs.prod-smoke-origin.result }}
        run: |
          set -euo pipefail
          echo "email=${EMAIL_RESULT} edge=${EDGE_RESULT} origin=${ORIGIN_RESULT}"
          if [ "${EMAIL_RESULT}" != "success" ]; then
            echo "::error::Email guards failed (${EMAIL_RESULT})."
            exit 1
          fi
          if [ "${ORIGIN_RESULT}" = "failure" ]; then
            echo "::error::Vercel origin smoke failed."
            exit 1
          fi
          if [ "${ORIGIN_RESULT}" = "skipped" ] && [ "${EDGE_RESULT}" != "success" ]; then
            echo "::error::Edge smoke failed and origin lane is not configured."
            exit 1
          fi
          if [ "${ORIGIN_RESULT}" = "success" ] && [ "${EDGE_RESULT}" = "failure" ]; then
            echo "::warning::Cloudflare edge failed while Vercel origin passed. Likely Bot Fight Mode."
          fi

  notify-whatsapp:
    if: always() && needs.schedule-gate.outputs.should_run == 'true'
    needs: [schedule-gate, prod-email-guards, prod-smoke-edge, prod-smoke-origin]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Send WhatsApp monitoring status
        id: whatsapp
        continue-on-error: true
        env:
          WHATSAPP_WEBHOOK_URL: ${{ secrets.WHATSAPP_WEBHOOK_URL }}
          EMAIL_RESULT: ${{ needs.prod-email-guards.result }}
          EDGE_RESULT: ${{ needs.prod-smoke-edge.result }}
          ORIGIN_RESULT: ${{ needs.prod-smoke-origin.result }}
          RUN_ID: ${{ github.run_id }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          NOTIFY_ONLY: ${{ github.event.inputs.notify_only || 'false' }}
          EXTRA_MESSAGE: ${{ github.event.inputs.notification_message || '' }}
        run: node scripts/send-whatsapp-monitoring.mjs

      - name: Open issue if WhatsApp notification failed
        if: steps.whatsapp.conclusion == 'failure'
        uses: actions/github-script@v7
        env:
          EMAIL_RESULT: ${{ needs.prod-email-guards.result }}
          EDGE_RESULT: ${{ needs.prod-smoke-edge.result }}
          ORIGIN_RESULT: ${{ needs.prod-smoke-origin.result }}
          RUN_ID: ${{ github.run_id }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        with:
          script: |
            const title = `[prod-monitoring] WhatsApp notification failed (run ${process.env.RUN_ID})`;
            const body = [
              "WhatsApp delivery failed after retries.",
              "",
              `Email guards: **${process.env.EMAIL_RESULT}**`,
              `Edge (mydoccy.com): **${process.env.EDGE_RESULT}**`,
              `Origin (Vercel): **${process.env.ORIGIN_RESULT}**`,
              `Run: ${process.env.RUN_URL}`,
              "",
              "Action required:",
              "- Verify `WHATSAPP_WEBHOOK_URL` repository secret.",
              "- Validate webhook provider health and recipient setup."
            ].join("\n");
            await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title,
              body,
              labels: ["ci", "monitoring"]
            });

      - name: Notification failure note (non-blocking)
        if: steps.whatsapp.conclusion == 'failure'
        shell: bash
        run: |
          echo "::warning::WhatsApp notification failed. Issue created. This does not change critical test status."
