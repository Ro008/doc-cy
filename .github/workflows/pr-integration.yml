# PR lane (blocking): integration Supabase + local app build/start on every PR.
# Nightly prod-only lane: .github/workflows/prod-critical-smoke.yml
# Policy: docs/ci-test-policy.md
#
# Layout:
#   1) pr-build — unit + Next build, uploads `.next`
#   2) pr-playwright-core + pr-playwright-finder — parallel Playwright lanes (reuse build)
#   3) pr-playwright-gate — single required check name for branch protection
#   4) pr-preview-public-shell — Vercel preview smoke (unchanged)
#
# Secrets: INTEGRATION_SUPABASE_URL, INTEGRATION_SUPABASE_ANON_KEY,
#          INTEGRATION_SUPABASE_SERVICE_ROLE_KEY, PROD_NEXT_PUBLIC_SUPABASE_URL (production URL only;
#          used to refuse running integration tests against prod Supabase).
# Optional repo variable: INTEGRATION_SCHEDULE_TEST_DOCTOR_SLUG (default andreas-nikos) for schedule_constraints.
# Optional legacy: INTEGRATION_BASE_URL — not required when building locally in CI.

name: PR Integration Tests

on:
  pull_request:
    branches:
      - "**"
  workflow_dispatch:

concurrency:
  group: pr-integration-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  INTEGRATION_SAFE_ENV: "1"
  PLAYWRIGHT_BASE_URL: http://127.0.0.1:3000
  PLAYWRIGHT_WEB_SERVER_COMMAND: npm run start
  NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.INTEGRATION_SUPABASE_URL }}
  NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.INTEGRATION_SUPABASE_ANON_KEY }}
  SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.INTEGRATION_SUPABASE_SERVICE_ROLE_KEY }}
  DOC_CY_SUPPRESS_TRAFFIC_LOG_SECRET: ${{ secrets.DOC_CY_SUPPRESS_TRAFFIC_LOG_SECRET }}
  TEST_USER_EMAIL: ${{ secrets.INTEGRATION_TEST_USER_EMAIL || secrets.TEST_USER_EMAIL }}
  TEST_USER_PASSWORD: ${{ secrets.INTEGRATION_TEST_USER_PASSWORD || secrets.TEST_USER_PASSWORD }}
  PROD_NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.PROD_NEXT_PUBLIC_SUPABASE_URL || secrets.NEXT_PUBLIC_SUPABASE_URL }}
  INTEGRATION_SCHEDULE_TEST_DOCTOR_SLUG: ${{ vars.INTEGRATION_SCHEDULE_TEST_DOCTOR_SLUG }}
  INTERNAL_DIRECTORY_SECRET: ${{ secrets.INTERNAL_DIRECTORY_SECRET }}
  NEXT_PUBLIC_DOC_CY_FINDER_INCLUDE_TEST_PROFILES: "1"
  NEXT_PUBLIC_FORMSPREE_ID: e2e_placeholder

jobs:
  pr-build:
    name: PR build + unit
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Validate isolated Supabase configuration
        shell: bash
        env:
          NEXT_PUBLIC_SUPABASE_URL: "${{ secrets.INTEGRATION_SUPABASE_URL }}"
          NEXT_PUBLIC_SUPABASE_ANON_KEY: "${{ secrets.INTEGRATION_SUPABASE_ANON_KEY }}"
          SUPABASE_SERVICE_ROLE_KEY: "${{ secrets.INTEGRATION_SUPABASE_SERVICE_ROLE_KEY }}"
          PROD_NEXT_PUBLIC_SUPABASE_URL: "${{ secrets.PROD_NEXT_PUBLIC_SUPABASE_URL || secrets.NEXT_PUBLIC_SUPABASE_URL }}"
        run: |
          set -euo pipefail
          missing=0

          if [ -z "${NEXT_PUBLIC_SUPABASE_URL}" ]; then
            echo "::error::Missing GitHub secret INTEGRATION_SUPABASE_URL."
            missing=1
          fi
          if [ -z "${NEXT_PUBLIC_SUPABASE_ANON_KEY}" ]; then
            echo "::error::Missing GitHub secret INTEGRATION_SUPABASE_ANON_KEY."
            missing=1
          fi
          if [ -z "${SUPABASE_SERVICE_ROLE_KEY}" ]; then
            echo "::error::Missing GitHub secret INTEGRATION_SUPABASE_SERVICE_ROLE_KEY."
            missing=1
          fi

          if [ "${missing}" -ne 0 ]; then
            echo "Add the INTEGRATION_* secrets in Repo Settings → Secrets and variables → Actions."
            if [ "${GITHUB_EVENT_NAME:-}" = "pull_request" ] && [ "${{ github.event.pull_request.head.repo.full_name }}" != "${{ github.repository }}" ]; then
              echo "This PR is from a fork; GitHub does not inject repository secrets into fork PR workflows."
            fi
            exit 1
          fi

          normalize_url() { echo "$1" | sed 's:/*$::'; }

          integration_norm="$(normalize_url "${NEXT_PUBLIC_SUPABASE_URL}")"
          prod_norm="$(normalize_url "${PROD_NEXT_PUBLIC_SUPABASE_URL:-}")"

          if echo "${integration_norm}" | grep -Eqi '\.supabase\.co'; then
            if [ -n "${prod_norm}" ] && [ "${integration_norm}" = "${prod_norm}" ]; then
              echo "Unsafe NEXT_PUBLIC_SUPABASE_URL matches production Supabase URL. Aborting."
              exit 1
            fi
          fi

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Validate blog image rule
        run: npm run test:content:blog-images

      - name: Validate messages EN/EL parity
        run: npm run test:content:messages-parity

      - name: Run unit tests (finder distance / clinic location)
        run: npm run test:unit

      - name: Build Next.js (PR branch)
        run: npm run build

      - name: Upload Next.js build
        uses: actions/upload-artifact@v4
        with:
          name: pr-next-build
          path: .next
          retention-days: 1
          include-hidden-files: true

  pr-playwright-core:
    name: PR Playwright · core
    needs: pr-build
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Download Next.js build
        uses: actions/download-artifact@v4
        with:
          name: pr-next-build
          path: .next

      - name: Install Playwright browsers
        run: |
          # --with-deps can hang 40+ minutes when Azure Ubuntu apt mirrors stall.
          # ubuntu-latest already has Chromium OS libraries; binaries-only is enough then.
          if ! timeout 120 npx playwright install --with-deps chromium; then
            echo "Playwright --with-deps timed out or failed; installing Chromium only."
            npx playwright install chromium
          fi

      - name: Run critical reschedule email guards
        env:
          CI: "true"
        run: |
          npx playwright test --grep @pr-email \
            --project="Desktop Large (Chromium)" \
            --workers=1 \
            --reporter=line

      - name: Run core Playwright suite
        env:
          CI: "true"
        run: |
          # Everything tagged @pr-e2e except the finder lane (@pr-e2e-finder).
          npx playwright test --grep @pr-e2e --grep-invert @pr-e2e-finder \
            --project="Desktop Large (Chromium)" \
            --workers=1 \
            --reporter=line

      - name: Upload Playwright report (core)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-pr-core-report
          path: |
            playwright-report
            test-results
          if-no-files-found: ignore

      - name: Run doctor confirmation flow monitors (tablet/mobile, non-blocking)
        if: always()
        continue-on-error: true
        env:
          CI: "true"
        run: |
          npx playwright test --grep @pr-mobile-monitor \
            --project="Mobile Chrome (Pixel 5)" \
            --workers=1 \
            --reporter=line

      - name: Run doctor login form monitor (non-blocking)
        if: always()
        continue-on-error: true
        env:
          CI: "true"
        run: |
          npx playwright test --grep @pr-login-monitor \
            --project="Desktop Large (Chromium)" \
            --workers=1 \
            --reporter=line

  pr-playwright-finder:
    name: PR Playwright · finder
    needs: pr-build
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Download Next.js build
        uses: actions/download-artifact@v4
        with:
          name: pr-next-build
          path: .next

      - name: Install Playwright browsers
        run: |
          # --with-deps can hang 40+ minutes when Azure Ubuntu apt mirrors stall.
          # ubuntu-latest already has Chromium OS libraries; binaries-only is enough then.
          if ! timeout 120 npx playwright install --with-deps chromium; then
            echo "Playwright --with-deps timed out or failed; installing Chromium only."
            npx playwright install chromium
          fi

      - name: Run finder Playwright suite
        env:
          CI: "true"
        run: |
          npx playwright test --grep @pr-e2e-finder \
            --project="Desktop Large (Chromium)" \
            --workers=1 \
            --reporter=line

      - name: Upload Playwright report (finder)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-pr-finder-report
          path: |
            playwright-report
            test-results
          if-no-files-found: ignore

  pr-cleanup-test-doctors:
    name: Cleanup integration test doctors
    needs: [pr-build, pr-playwright-core, pr-playwright-finder]
    if: always() && needs.pr-build.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      # Sweep ephemeral Finder Filter / Finder UX doctors left by interrupted runs.
      - name: Cleanup orphan integration test doctors
        env:
          PLAYWRIGHT_ENV_FILE: ""
        run: node scripts/cleanup-test-doctors.mjs --assert-empty

  # Preserves the historical required-check name used in branch protection.
  pr-playwright-gate:
    name: PR Playwright (core business)
    needs: [pr-playwright-core, pr-playwright-finder, pr-cleanup-test-doctors]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Require both Playwright lanes (+ cleanup)
        shell: bash
        run: |
          set -euo pipefail
          echo "core=${{ needs.pr-playwright-core.result }}"
          echo "finder=${{ needs.pr-playwright-finder.result }}"
          echo "cleanup=${{ needs.pr-cleanup-test-doctors.result }}"
          test "${{ needs.pr-playwright-core.result }}" = "success"
          test "${{ needs.pr-playwright-finder.result }}" = "success"
          test "${{ needs.pr-cleanup-test-doctors.result }}" = "success"

  pr-preview-public-shell:
    name: PR Preview site health (Vercel)
    runs-on: ubuntu-latest
    timeout-minutes: 25
    if: github.event_name == 'pull_request'
    permissions:
      contents: read
      pull-requests: read
      deployments: read

    steps:
      - name: Fork PR — skip Vercel preview
        id: fork
        shell: bash
        run: |
          if [ "${{ github.event.pull_request.head.repo.full_name }}" != "${{ github.repository }}" ]; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
            echo "Fork PR: skipping Vercel preview smoke (no deployment on this repo)."
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Wait for Vercel Preview
        if: steps.fork.outputs.skip == 'false'
        id: vercel
        uses: patrickedqvist/wait-for-vercel-preview@v1.3.1
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          max_timeout: 600

      - name: Checkout
        if: steps.fork.outputs.skip == 'false'
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node
        if: steps.fork.outputs.skip == 'false'
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies (Playwright only)
        if: steps.fork.outputs.skip == 'false'
        run: npm ci

      - name: Install Playwright browsers
        if: steps.fork.outputs.skip == 'false'
        run: |
          # --with-deps can hang 40+ minutes when Azure Ubuntu apt mirrors stall.
          # ubuntu-latest already has Chromium OS libraries; binaries-only is enough then.
          if ! timeout 120 npx playwright install --with-deps chromium; then
            echo "Playwright --with-deps timed out or failed; installing Chromium only."
            npx playwright install chromium
          fi

      - name: Run public shell tests against Preview URL
        if: steps.fork.outputs.skip == 'false'
        env:
          PLAYWRIGHT_BASE_URL: ${{ steps.vercel.outputs.url }}
          PLAYWRIGHT_PREVIEW_SMOKE: "1"
          CI: "true"
          DOC_CY_SUPPRESS_TRAFFIC_LOG_SECRET: ${{ secrets.DOC_CY_SUPPRESS_TRAFFIC_LOG_SECRET }}
        run: |
          npx playwright test --grep @pr-preview \
            --project="Desktop Large (Chromium)" \
            --reporter=line

      - name: Fork skip notice
        if: steps.fork.outputs.skip == 'true'
        run: echo "OK — Vercel preview job skipped (fork PR)."
