# PR lane (blocking) on every PR. Nightly prod-only lane: .github/workflows/prod-critical-smoke.yml
# Policy: docs/ci-test-policy.md
#
# Layout (all jobs start at once):
#   1) pr-build — content checks, unit tests, typecheck
#   2) pr-playwright-booking + pr-playwright-account + pr-playwright-finder — Playwright lanes, each
#      on its own throwaway Supabase stack in the runner, with its own app build
#      (.github/actions/local-supabase, scripts/ci-db/). No PR job touches the Testing project.
#   3) pr-playwright-gate — single required check name for branch protection
#   4) pr-preview-public-shell — Vercel preview smoke (unchanged)
#
# Secrets: PROD_NEXT_PUBLIC_SUPABASE_URL (production URL only; the specs refuse to run against it).

name: PR Integration Tests

on:
  pull_request:
    branches:
      - "**"
  workflow_dispatch:

concurrency:
  group: pr-integration-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  INTEGRATION_SAFE_ENV: "1"
  PLAYWRIGHT_BASE_URL: http://127.0.0.1:3000
  PLAYWRIGHT_WEB_SERVER_COMMAND: npm run start
  PROD_NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.PROD_NEXT_PUBLIC_SUPABASE_URL || secrets.NEXT_PUBLIC_SUPABASE_URL }}
  NEXT_PUBLIC_DOC_CY_FINDER_INCLUDE_TEST_PROFILES: "1"
  NEXT_PUBLIC_FORMSPREE_ID: e2e_placeholder

jobs:
  pr-build:
    name: PR build + unit
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Validate blog image rule
        run: npm run test:content:blog-images

      - name: Validate messages EN/EL parity
        run: npm run test:content:messages-parity

      - name: Run unit tests
        run: npm run test:unit

      # Each Playwright lane runs `next build` against its own stack; this also covers tests/ and scripts/.
      - name: Typecheck (whole project, including tests)
        run: npx tsc --noEmit

  pr-playwright-booking:
    name: PR Playwright · booking
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Local Supabase stack + build
        id: stack
        uses: ./.github/actions/local-supabase

      - name: Install Playwright browsers
        run: |
          # --with-deps can hang 40+ minutes when Azure Ubuntu apt mirrors stall.
          # ubuntu-latest already has Chromium OS libraries; binaries-only is enough then.
          if ! timeout 120 npx playwright install --with-deps chromium; then
            echo "Playwright --with-deps timed out or failed; installing Chromium only."
            npx playwright install chromium
          fi

      - name: Run critical reschedule email guards
        env:
          CI: "true"
          NEXT_PUBLIC_SUPABASE_URL: ${{ steps.stack.outputs.supabase_url }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ steps.stack.outputs.anon_key }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ steps.stack.outputs.service_role_key }}
          TEST_USER_EMAIL: ${{ steps.stack.outputs.test_user_email }}
          TEST_USER_PASSWORD: ${{ steps.stack.outputs.test_user_password }}
        run: |
          npx playwright test --grep @pr-email \
            --project="Desktop Large (Chromium)" \
            --workers=1 \
            --reporter=line

      - name: Run booking Playwright suite
        env:
          CI: "true"
          NEXT_PUBLIC_SUPABASE_URL: ${{ steps.stack.outputs.supabase_url }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ steps.stack.outputs.anon_key }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ steps.stack.outputs.service_role_key }}
          TEST_USER_EMAIL: ${{ steps.stack.outputs.test_user_email }}
          TEST_USER_PASSWORD: ${{ steps.stack.outputs.test_user_password }}
        run: |
          npx playwright test --grep @pr-e2e-booking \
            --project="Desktop Large (Chromium)" \
            --workers=1 \
            --reporter=line

      - name: Upload Playwright report (booking)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-pr-booking-report
          path: |
            playwright-report
            test-results
          if-no-files-found: ignore

      - name: Run doctor confirmation flow monitors (tablet/mobile, non-blocking)
        if: always()
        continue-on-error: true
        env:
          CI: "true"
          NEXT_PUBLIC_SUPABASE_URL: ${{ steps.stack.outputs.supabase_url }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ steps.stack.outputs.anon_key }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ steps.stack.outputs.service_role_key }}
          TEST_USER_EMAIL: ${{ steps.stack.outputs.test_user_email }}
          TEST_USER_PASSWORD: ${{ steps.stack.outputs.test_user_password }}
        run: |
          npx playwright test --grep @pr-mobile-monitor \
            --project="Mobile Chrome (Pixel 5)" \
            --workers=1 \
            --reporter=line

  pr-playwright-account:
    name: PR Playwright · account
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Local Supabase stack + build
        id: stack
        uses: ./.github/actions/local-supabase

      - name: Install Playwright browsers
        run: |
          # --with-deps can hang 40+ minutes when Azure Ubuntu apt mirrors stall.
          # ubuntu-latest already has Chromium OS libraries; binaries-only is enough then.
          if ! timeout 120 npx playwright install --with-deps chromium; then
            echo "Playwright --with-deps timed out or failed; installing Chromium only."
            npx playwright install chromium
          fi

      - name: Run account Playwright suite
        env:
          CI: "true"
          NEXT_PUBLIC_SUPABASE_URL: ${{ steps.stack.outputs.supabase_url }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ steps.stack.outputs.anon_key }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ steps.stack.outputs.service_role_key }}
          TEST_USER_EMAIL: ${{ steps.stack.outputs.test_user_email }}
          TEST_USER_PASSWORD: ${{ steps.stack.outputs.test_user_password }}
        run: |
          # Remaining @pr-e2e (onboarding, settings, directory, marketing UI).
          # Excludes finder + booking lanes so retries stay scoped.
          npx playwright test --grep @pr-e2e --grep-invert "@pr-e2e-finder|@pr-e2e-booking" \
            --project="Desktop Large (Chromium)" \
            --workers=1 \
            --reporter=line

      - name: Upload Playwright report (account)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-pr-account-report
          path: |
            playwright-report
            test-results
          if-no-files-found: ignore

      - name: Run doctor login form monitor (non-blocking)
        if: always()
        continue-on-error: true
        env:
          CI: "true"
          NEXT_PUBLIC_SUPABASE_URL: ${{ steps.stack.outputs.supabase_url }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ steps.stack.outputs.anon_key }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ steps.stack.outputs.service_role_key }}
          TEST_USER_EMAIL: ${{ steps.stack.outputs.test_user_email }}
          TEST_USER_PASSWORD: ${{ steps.stack.outputs.test_user_password }}
        run: |
          npx playwright test --grep @pr-login-monitor \
            --project="Desktop Large (Chromium)" \
            --workers=1 \
            --reporter=line

  pr-playwright-finder:
    name: PR Playwright · finder
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Local Supabase stack + build
        id: stack
        uses: ./.github/actions/local-supabase

      - name: Install Playwright browsers
        run: |
          # --with-deps can hang 40+ minutes when Azure Ubuntu apt mirrors stall.
          # ubuntu-latest already has Chromium OS libraries; binaries-only is enough then.
          if ! timeout 120 npx playwright install --with-deps chromium; then
            echo "Playwright --with-deps timed out or failed; installing Chromium only."
            npx playwright install chromium
          fi

      - name: Run finder Playwright suite
        env:
          CI: "true"
          NEXT_PUBLIC_SUPABASE_URL: ${{ steps.stack.outputs.supabase_url }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ steps.stack.outputs.anon_key }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ steps.stack.outputs.service_role_key }}
          TEST_USER_EMAIL: ${{ steps.stack.outputs.test_user_email }}
          TEST_USER_PASSWORD: ${{ steps.stack.outputs.test_user_password }}
        run: |
          npx playwright test --grep @pr-e2e-finder \
            --project="Desktop Large (Chromium)" \
            --workers=1 \
            --reporter=line

      - name: Upload Playwright report (finder)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-pr-finder-report
          path: |
            playwright-report
            test-results
          if-no-files-found: ignore

  # Preserves the historical required-check name used in branch protection.
  pr-playwright-gate:
    name: PR Playwright (core business)
    needs: [pr-build, pr-playwright-booking, pr-playwright-account, pr-playwright-finder]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Require build + unit and all Playwright lanes
        shell: bash
        run: |
          set -euo pipefail
          echo "build=${{ needs.pr-build.result }}"
          echo "booking=${{ needs.pr-playwright-booking.result }}"
          echo "account=${{ needs.pr-playwright-account.result }}"
          echo "finder=${{ needs.pr-playwright-finder.result }}"
          test "${{ needs.pr-build.result }}" = "success"
          test "${{ needs.pr-playwright-booking.result }}" = "success"
          test "${{ needs.pr-playwright-account.result }}" = "success"
          test "${{ needs.pr-playwright-finder.result }}" = "success"

  pr-preview-public-shell:
    name: PR Preview site health (Vercel)
    runs-on: ubuntu-latest
    timeout-minutes: 25
    if: github.event_name == 'pull_request'
    permissions:
      contents: read
      pull-requests: read
      deployments: read

    steps:
      - name: Fork PR — skip Vercel preview
        id: fork
        shell: bash
        run: |
          if [ "${{ github.event.pull_request.head.repo.full_name }}" != "${{ github.repository }}" ]; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
            echo "Fork PR: skipping Vercel preview smoke (no deployment on this repo)."
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Wait for Vercel Preview
        if: steps.fork.outputs.skip == 'false'
        id: vercel
        uses: patrickedqvist/wait-for-vercel-preview@v1.3.1
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          max_timeout: 600

      - name: Checkout
        if: steps.fork.outputs.skip == 'false'
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node
        if: steps.fork.outputs.skip == 'false'
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies (Playwright only)
        if: steps.fork.outputs.skip == 'false'
        run: npm ci

      - name: Install Playwright browsers
        if: steps.fork.outputs.skip == 'false'
        run: |
          # --with-deps can hang 40+ minutes when Azure Ubuntu apt mirrors stall.
          # ubuntu-latest already has Chromium OS libraries; binaries-only is enough then.
          if ! timeout 120 npx playwright install --with-deps chromium; then
            echo "Playwright --with-deps timed out or failed; installing Chromium only."
            npx playwright install chromium
          fi

      - name: Run public shell tests against Preview URL
        if: steps.fork.outputs.skip == 'false'
        env:
          PLAYWRIGHT_BASE_URL: ${{ steps.vercel.outputs.url }}
          PLAYWRIGHT_PREVIEW_SMOKE: "1"
          CI: "true"
          # Placeholders: Playwright loads every spec file before filtering by tag, and some
          # create a Supabase client at load time. The @pr-preview specs never call Supabase.
          NEXT_PUBLIC_SUPABASE_URL: http://127.0.0.1:54321
          SUPABASE_SERVICE_ROLE_KEY: unused-by-preview-smoke
        run: |
          npx playwright test --grep @pr-preview \
            --project="Desktop Large (Chromium)" \
            --reporter=line

      - name: Fork skip notice
        if: steps.fork.outputs.skip == 'true'
        run: echo "OK — Vercel preview job skipped (fork PR)."
